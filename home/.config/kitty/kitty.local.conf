# Local Kitty tweaks. Colors come from themes/noctalia.conf (generated by
# Noctalia from the wallpaper palette) — do not set colors here.

# Slight transparency. Requires a compositor with alpha (niri has it).
background_opacity    0.8

# Breathing room inside the window.
window_padding_width  6

# Enables `pkill -USR1 kitty` to reload config, and `kitty @ set-colors` etc.
allow_remote_control  socket

hide_window_decorations yes

# Nerd Font — required by the zsh config (starship prompt glyphs, eza icons)
font_family      JetBrainsMono Nerd Font
font_size        12.0
